<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 720" role="img" aria-labelledby="title desc">
  <title id="title">The giantess</title>
  <desc id="desc">A tall, friendly giantess with red hair, a purple dress and a cream apron.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2c39d"/><stop offset="1" stop-color="#d79a72"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a452b8"/><stop offset="1" stop-color="#5e2378"/></linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3da"/><stop offset="1" stop-color="#e3cba8"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c05a2f"/><stop offset="1" stop-color="#7e3218"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2a1745" flood-opacity=".3"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <ellipse cx="170" cy="694" rx="112" ry="20" fill="#1c1138" opacity=".32"/>
    <!-- hair behind -->
    <path d="M78 154c-14 96-20 206-6 300 8 52 34 56 46 16 10-34 8-120 14-188z" fill="url(#hair)"/>
    <path d="M262 154c14 96 20 206 6 300-8 52-34 56-46 16-10-34-8-120-14-188z" fill="url(#hair)"/>
    <!-- dress -->
    <path d="M100 238c10-36 34-54 70-54s60 18 70 54l38 302H62z" fill="url(#dress)"/>
    <path d="M92 540h156l20 92H72z" fill="#4a1a62"/>
    <path d="M80 632h180" stroke="#e0b34a" stroke-width="7"/>
    <!-- apron -->
    <path d="M136 246h68l18 160c-22 26-82 26-104 0z" fill="url(#apron)"/>
    <path d="M136 246l-20-42M204 246l20-42" stroke="#e3cba8" stroke-width="7" stroke-linecap="round"/>
    <path d="M122 400h96" stroke="#d6b98c" stroke-width="6"/>
    <!-- arms -->
    <path d="M100 248c-32 18-48 56-40 98 6 26 22 34 38 22 12-10 16-32 22-48 8-20 18-36 32-46z" fill="url(#dress)"/>
    <path d="M240 248c32 18 48 56 40 98-6 26-22 34-38 22-12-10-16-32-22-48-8-20-18-36-32-46z" fill="url(#dress)"/>
    <g fill="url(#skin)" stroke="#c78d63" stroke-width="3">
      <path d="M108 362c-14 6-22 22-16 36 6 12 22 16 34 10l4-34z"/>
      <path d="M232 362c14 6 22 22 16 36-6 12-22 16-34 10l-4-34z"/>
    </g>
    <!-- neck -->
    <path d="M148 200h44v36h-44z" fill="#d79a72"/>
    <!-- head -->
    <ellipse cx="170" cy="144" rx="66" ry="76" fill="url(#skin)"/>
    <!-- ears -->
    <ellipse cx="105" cy="150" rx="12" ry="20" fill="#e8b08a" stroke="#c78d63" stroke-width="3"/>
    <ellipse cx="235" cy="150" rx="12" ry="20" fill="#e8b08a" stroke="#c78d63" stroke-width="3"/>
    <!-- hair front -->
    <path d="M100 142c-6-60 30-92 70-92 44 0 78 34 72 94-4 30-14 42-24 8-8-28-26-36-50-32-22 4-36 14-50 16-10 2-14 12-18 6z" fill="url(#hair)"/>
    <path d="M104 118c-10-24 4-48 24-56M236 118c10-24-4-48-24-56" fill="none" stroke="#7e3218" stroke-width="6" stroke-linecap="round"/>
    <!-- eyes -->
    <path d="M134 128c8-6 18-6 26 0M180 128c8-6 18-6 26 0" stroke="#5c2f1d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="147" cy="144" rx="7" ry="8" fill="#3a2418"/>
    <ellipse cx="193" cy="144" rx="7" ry="8" fill="#3a2418"/>
    <circle cx="149" cy="141" r="2.4" fill="#fff"/><circle cx="195" cy="141" r="2.4" fill="#fff"/>
    <!-- nose -->
    <path d="M170 142c-4 10-4 20 2 24 5 3 10 3 15 0" fill="none" stroke="#c78d63" stroke-width="4" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M152 178c12 10 26 10 38 0-4 18-34 18-38 0z" fill="#a3473f"/>
    <path d="M156 180c8 6 20 6 28 0" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/>
    <circle cx="126" cy="166" r="8" fill="#e8887e" opacity=".5"/>
    <circle cx="214" cy="166" r="8" fill="#e8887e" opacity=".5"/>
    <!-- earrings -->
    <circle cx="105" cy="172" r="6" fill="#ffd25e"/><circle cx="235" cy="172" r="6" fill="#ffd25e"/>
    <!-- collar -->
    <path d="M136 212c10 12 22 18 34 18s24-6 34-18" fill="none" stroke="#f4e8cf" stroke-width="8"/>
  </g>
</svg>
