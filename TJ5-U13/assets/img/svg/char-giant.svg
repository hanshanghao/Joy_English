<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" role="img" aria-labelledby="title desc">
  <title id="title">The giant</title>
  <desc id="desc">A large, grumpy but friendly giant with a brown beard, purple tunic and leather belt.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b48a"/><stop offset="1" stop-color="#c98b5f"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a9e"/><stop offset="1" stop-color="#402a6d"/></linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#57341d"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5a2b"/><stop offset="1" stop-color="#5a3618"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2a1745" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <ellipse cx="210" cy="694" rx="140" ry="22" fill="#1c1138" opacity=".35"/>
    <!-- legs -->
    <path d="M120 510c-10 56-20 112-14 150 4 22 40 22 48-2 8-26 14-86 22-136z" fill="#4a3a66"/>
    <path d="M300 510c10 56 20 112 14 150-4 22-40 22-48-2-8-26-14-86-22-136z" fill="#4a3a66"/>
    <path d="M100 654c-20 4-30 20-20 34 12 16 50 16 72 4l6-30z" fill="#2f2447"/>
    <path d="M320 654c20 4 30 20 20 34-12 16-50 16-72 4l-6-30z" fill="#2f2447"/>
    <!-- body -->
    <path d="M112 250c16-46 52-70 98-70s82 24 98 70l28 276H84z" fill="url(#tunic)"/>
    <path d="M84 526h252l6 36H78z" fill="#332351"/>
    <path d="M88 300c-32 10-48 44-40 84 6 30 22 58 42 76l26-18c-16-24-26-50-30-74-4-24 4-42 20-52z" fill="url(#tunic)"/>
    <path d="M332 300c32 10 48 44 40 84-6 30-22 58-42 76l-26-18c16-24 26-50 30-74 4-24-4-42-20-52z" fill="url(#tunic)"/>
    <!-- belt -->
    <path d="M96 430h228l4 42H92z" fill="url(#leather)"/>
    <rect x="182" y="426" width="56" height="52" rx="8" fill="#d6a744" stroke="#8a641b" stroke-width="4"/>
    <rect x="198" y="442" width="24" height="20" rx="4" fill="#6d4a13"/>
    <!-- hands -->
    <g fill="url(#skin)" stroke="#b37750" stroke-width="3">
      <path d="M64 456c-16 4-24 18-20 34 4 14 18 24 34 22l14-42z"/>
      <path d="M356 456c16 4 24 18 20 34-4 14-18 24-34 22l-14-42z"/>
    </g>
    <g stroke="#b37750" stroke-width="4" stroke-linecap="round">
      <path d="M52 478c-8 6-10 14-8 20M60 470c-8 6-10 14-8 20M368 478c8 6 10 14 8 20M360 470c8 6 10 14 8 20"/>
    </g>
    <!-- neck -->
    <path d="M178 222h64v42h-64z" fill="#c98b5f"/>
    <!-- head -->
    <ellipse cx="210" cy="156" rx="86" ry="92" fill="url(#skin)"/>
    <!-- ears -->
    <ellipse cx="122" cy="164" rx="20" ry="26" fill="#d99c73" stroke="#b37750" stroke-width="3"/>
    <ellipse cx="298" cy="164" rx="20" ry="26" fill="#d99c73" stroke="#b37750" stroke-width="3"/>
    <!-- hair -->
    <path d="M124 132c-6-66 40-104 88-104 52 0 94 40 84 108-4 18-12 12-18-2-14-30-40-40-72-34-30 6-48 24-66 28-10 2-14 8-16 4z" fill="#5d3a22"/>
    <!-- eyes -->
    <path d="M154 144c12-8 26-8 38 0M228 144c12-8 26-8 38 0" stroke="#4b2f1c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="174" cy="162" rx="9" ry="10" fill="#2f2118"/>
    <ellipse cx="246" cy="162" rx="9" ry="10" fill="#2f2118"/>
    <circle cx="177" cy="158" r="3" fill="#fff"/><circle cx="249" cy="158" r="3" fill="#fff"/>
    <!-- nose -->
    <path d="M210 158c-8 12-8 28 2 34 8 4 16 4 24 0" fill="none" stroke="#b37750" stroke-width="5" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M148 128c14-12 32-12 46-4M272 128c-14-12-32-12-46-4" stroke="#4b2f1c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- beard -->
    <path d="M132 188c6 46 28 116 78 132 50-16 72-86 78-132-16 22-46 34-78 34s-62-12-78-34z" fill="url(#beard)"/>
    <path d="M164 224c10 30 24 54 46 66 22-12 36-36 46-66-28 14-64 14-92 0z" fill="#6b4428" opacity=".6"/>
    <!-- moustache -->
    <path d="M170 206c12 8 22 10 40 4 18 6 28 4 40-4-14 24-26 30-40 30s-26-6-40-30z" fill="#5d3a22"/>
    <!-- mouth -->
    <path d="M194 246c10-4 22-4 32 0" stroke="#4f2a22" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- stomach shading -->
    <path d="M150 330c14 26 34 38 60 38s46-12 60-38" stroke="#332351" stroke-width="5" fill="none" opacity=".45"/>
    <!-- shoulder studs -->
    <circle cx="132" cy="270" r="9" fill="#d6a744"/><circle cx="288" cy="270" r="9" fill="#d6a744"/>
    <!-- tunic trim -->
    <path d="M172 190c8 16 22 24 38 24s30-8 38-24" stroke="#d6a744" stroke-width="6" fill="none"/>
  </g>
</svg>
