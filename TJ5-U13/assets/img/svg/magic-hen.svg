<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">The magic hen</title>
  <desc id="desc">A plump golden hen with ornate feathers and a glowing magical aura.</desc>
  <defs>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe58a" stop-opacity=".9"/><stop offset=".55" stop-color="#ffc93c" stop-opacity=".25"/><stop offset="1" stop-color="#ffc93c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#ffc93c"/><stop offset="1" stop-color="#d98e17"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c2"/><stop offset="1" stop-color="#e8a323"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#c62828"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <circle cx="150" cy="150" r="138" fill="url(#aura)"/>
  <!-- sparkles -->
  <g fill="#fff4b8">
    <path d="M58 80l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
    <path d="M238 96l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
    <path d="M236 214l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
    <circle cx="70" cy="206" r="4"/><circle cx="212" cy="58" r="3"/>
  </g>
  <!-- tail feathers -->
  <g fill="url(#wing)" stroke="#c58a13" stroke-width="3">
    <path d="M86 168c-44-28-52-72-32-92 22-22 58-4 64 34z"/>
    <path d="M82 176c-52-10-70-46-58-70 14-26 56-18 70 14z"/>
    <path d="M88 188c-48 6-64-20-58-42 8-24 46-24 62 2z"/>
  </g>
  <!-- body -->
  <path d="M96 180c0-62 32-100 76-100 50 0 82 42 82 104 0 52-36 82-86 82-48 0-72-34-72-86z" fill="url(#body)" stroke="#c58a13" stroke-width="4"/>
  <path d="M114 188c8 38 38 60 72 60 34 0 56-20 64-48-26 14-48 18-70 14-28-4-50-14-66-26z" fill="#f0b52e" opacity=".55"/>
  <!-- wing -->
  <path d="M160 170c30-18 62-12 74 14 10 24-6 48-40 54-26 4-46-10-50-32-2-14 2-26 16-36z" fill="url(#wing)" stroke="#c58a13" stroke-width="4"/>
  <g stroke="#c58a13" stroke-width="3" fill="none" opacity=".65">
    <path d="M172 188c14-6 30-4 42 6M170 204c14-6 28-4 40 4M174 218c12-4 22-2 32 4"/>
  </g>
  <!-- chest -->
  <path d="M112 210c10 26 32 42 60 42" fill="none" stroke="#fff0b0" stroke-width="8" opacity=".65"/>
  <!-- head -->
  <g>
    <circle cx="120" cy="110" r="50" fill="url(#body)" stroke="#c58a13" stroke-width="4"/>
    <!-- comb -->
    <path d="M92 70c-4-22 10-32 22-24 2-18 20-22 28-8 12-12 28-2 24 18-18 10-52 16-74 14z" fill="url(#red)" stroke="#8e1b1b" stroke-width="3"/>
    <!-- eye -->
    <circle cx="108" cy="102" r="11" fill="#fff"/>
    <circle cx="110" cy="102" r="6" fill="#2f2118"/>
    <circle cx="112" cy="99" r="2" fill="#fff"/>
    <!-- beak -->
    <path d="M78 120c-18 0-26 10-20 20 6 10 22 12 32 4 8-6 6-20-12-24z" fill="#f2a126" stroke="#c57a12" stroke-width="3"/>
    <path d="M60 134c10 4 20 4 30 0" stroke="#b86a0b" stroke-width="2" fill="none"/>
    <!-- wattle -->
    <path d="M88 146c-4 16 4 24 12 20 6-4 6-14 2-22z" fill="url(#red)" stroke="#8e1b1b" stroke-width="2"/>
    <!-- ear tuft -->
    <path d="M150 82c14-8 26-4 30 8-12 6-24 6-34 0z" fill="#e8a323"/>
  </g>
  <!-- legs -->
  <g stroke="#c57a12" stroke-width="7" stroke-linecap="round">
    <path d="M136 256v20M180 256v20"/>
    <path d="M136 276l-12 10M136 276l12 10M136 276v12M180 276l-12 10M180 276l12 10M180 276v12"/>
  </g>
  <!-- glowing egg beneath -->
  <ellipse cx="158" cy="292" rx="46" ry="8" fill="#ffe58a" opacity=".55" filter="url(#soft)"/>
</svg>
