<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A poor child with empty pockets</title>
  <desc id="desc">A child in a patched tunic turns out empty pockets beside a humble cottage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8cdb5"/><stop offset="1" stop-color="#a8977c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c7c5f"/><stop offset="1" stop-color="#6a5b43"/>
    </linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9a68"/><stop offset="1" stop-color="#556e45"/>
    </linearGradient>
    <linearGradient id="hut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b89a72"/><stop offset="1" stop-color="#8b6c4a"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="430" width="800" height="170" fill="url(#ground)"/>
  <path d="M0 470c90-15 160 8 250-2s170-24 270-8 190 18 280 0v140H0z" fill="#7b6b50"/>

  <!-- distant hills -->
  <path d="M0 390c120-70 220-40 320-16 110 26 180-40 290-34 80 4 140 36 190 54v60H0z" fill="#9b8d72" opacity=".75"/>
  <path d="M0 420c120-44 230-24 330 0 90 22 190-20 300-10 70 6 120 22 170 34v20H0z" fill="#8a7b60" opacity=".8"/>

  <!-- humble cottage -->
  <g transform="translate(470 250)">
    <path d="M0 70l140-78 140 78z" fill="#7b4a2c"/>
    <path d="M18 66l122-68 122 68z" fill="#9b633d"/>
    <rect x="26" y="66" width="228" height="132" fill="url(#hut)"/>
    <g stroke="#6f5438" stroke-width="3" opacity=".4">
      <path d="M26 98h228M26 130h228M26 162h228M90 66v132M156 66v132M214 66v132"/>
    </g>
    <rect x="48" y="100" width="52" height="52" rx="4" fill="#5e6f74"/>
    <path d="M74 100v52M48 126h52" stroke="#8b6c4a" stroke-width="5"/>
    <rect x="178" y="112" width="54" height="86" rx="4" fill="#4c3524"/>
    <circle cx="220" cy="158" r="3.5" fill="#d1ad62"/>
    <path d="M150 66V34h26v40z" fill="#715136"/>
    <path d="M158 30c6-18 3-28-4-38M167 30c-4-16 1-24 9-32" stroke="#c3b69a" stroke-width="4" fill="none" opacity=".5"/>
    <path d="M26 66h228" stroke="#5d3b22" stroke-width="8"/>
  </g>

  <!-- fence -->
  <g stroke="#6f5438" stroke-width="8" stroke-linecap="round">
    <path d="M30 470v-74M88 470v-84M146 470v-74M204 470v-84M20 420h200M20 450h200"/>
  </g>
  <path d="M30 396l-6-12 6-12 6 12zM88 386l-6-12 6-12 6 12zM146 396l-6-12 6-12 6 12zM204 386l-6-12 6-12 6 12z" fill="#6f5438"/>

  <!-- child -->
  <g transform="translate(280 120)">
    <ellipse cx="120" cy="382" rx="108" ry="20" fill="#4f422f" opacity=".35"/>
    <!-- legs -->
    <path d="M82 300l-6 78h30l8-78zM138 300l4 78h30l-8-78z" fill="#7b6a4c"/>
    <path d="M68 376c-14 2-20 12-14 20 8 10 34 8 48 2l2-22zM174 376c14 2 20 12 14 20-8 10-34 8-48 2l-2-22z" fill="#4c3e2c"/>
    <!-- tunic with patches -->
    <path d="M66 178c8-34 28-50 54-50 28 0 50 18 56 52l10 134H56z" fill="url(#tunic)"/>
    <path d="M56 312h130" stroke="#3f5433" stroke-width="9"/>
    <g fill="#a8ad72" stroke="#5b6a42" stroke-width="2">
      <rect x="74" y="208" width="28" height="24" rx="3" transform="rotate(-6 88 220)"/>
      <rect x="138" y="246" width="24" height="22" rx="3" transform="rotate(8 150 257)"/>
      <rect x="96" y="284" width="20" height="18" rx="3" transform="rotate(-4 106 293)"/>
    </g>
    <g stroke="#3f5433" stroke-width="1.5" opacity=".7">
      <path d="M80 207l16 26M80 233l16-26M142 246l16 22M142 268l16-22"/>
    </g>
    <!-- empty pockets -->
    <path d="M58 260c-10 12-14 38-4 56 8 14 26 10 28-6 2-18-6-42-12-50z" fill="#687f52" stroke="#3f5433" stroke-width="4"/>
    <path d="M184 260c10 12 14 38 4 56-8 14-26 10-28-6-2-18 6-42 12-50z" fill="#687f52" stroke="#3f5433" stroke-width="4"/>
    <path d="M58 264c10 7 18 7 28 0" stroke="#d8d3ad" stroke-width="7" fill="none"/>
    <path d="M156 264c10 7 18 7 28 0" stroke="#d8d3ad" stroke-width="7" fill="none"/>
    <path d="M66 292c-8 14-6 26 4 30M174 292c8 14 6 26-4 30" stroke="#4a5c38" stroke-width="3" fill="none"/>
    <!-- arms -->
    <path d="M58 196c-24 18-34 42-28 60 4 12 18 12 22 0 6-16 18-30 34-38z" fill="#c89b74" stroke="#a87a55" stroke-width="3"/>
    <path d="M182 196c24 18 34 42 28 60-4 12-18 12-22 0-6-16-18-30-34-38z" fill="#c89b74" stroke="#a87a55" stroke-width="3"/>
    <!-- neck -->
    <path d="M106 160h34v34h-34z" fill="#c89b74"/>
    <!-- head -->
    <g>
      <circle cx="122" cy="120" r="54" fill="#d8aa80"/>
      <path d="M68 116c0-40 24-64 55-64 33 0 56 26 54 66-1 10-7 12-12 2-10-20-27-24-47-20-20 4-30 14-42 16-7 1-8 2-8 0z" fill="#5a3823"/>
      <path d="M92 122c6-5 13-5 19 0M134 122c6-5 13-5 19 0" stroke="#5a3823" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="102" cy="132" rx="6.5" ry="8" fill="#3b291c"/>
      <ellipse cx="144" cy="132" rx="6.5" ry="8" fill="#3b291c"/>
      <circle cx="104" cy="129" r="2" fill="#fff"/><circle cx="146" cy="129" r="2" fill="#fff"/>
      <path d="M111 156c8-6 18-6 25 0" stroke="#7c4a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M92 148c4 8 2 14-3 17M152 148c-4 8-2 14 3 17" stroke="#b57f58" stroke-width="2" fill="none" opacity=".6"/>
      <path d="M68 106c-6-12 2-24 13-24M174 106c6-12-2-24-13-24" fill="none" stroke="#5a3823" stroke-width="5" stroke-linecap="round"/>
      <!-- patched cap -->
      <path d="M60 90c8-38 42-54 74-46 28 7 45 30 44 55-24-8-82-8-118-9z" fill="#6b7a4a"/>
      <path d="M58 90c30 4 90 5 120 0" stroke="#4c5a33" stroke-width="8" stroke-linecap="round"/>
      <rect x="98" y="58" width="24" height="20" rx="4" fill="#8f9a62" transform="rotate(10 110 68)"/>
    </g>
  </g>

  <!-- empty bowl and stone -->
  <g transform="translate(80 480)">
    <ellipse cx="58" cy="36" rx="58" ry="16" fill="#5e503b"/>
    <path d="M0 12c4 26 24 38 58 38s54-12 58-38z" fill="#8a7454"/>
    <ellipse cx="58" cy="12" rx="58" ry="16" fill="#a58b64"/>
    <ellipse cx="58" cy="12" rx="46" ry="11" fill="#6b5a42"/>
  </g>
  <g fill="#7d6d52" opacity=".8">
    <ellipse cx="420" cy="512" rx="20" ry="9"/><ellipse cx="380" cy="530" rx="12" ry="6"/><ellipse cx="620" cy="530" rx="16" ry="7"/>
  </g>

  <!-- dust motes -->
  <g fill="#efe4c7" opacity=".45">
    <circle cx="200" cy="160" r="3"/><circle cx="260" cy="90" r="2"/><circle cx="700" cy="120" r="2.5"/><circle cx="740" cy="330" r="3"/><circle cx="360" cy="200" r="2"/>
  </g>
  <rect width="800" height="600" filter="url(#grain)" opacity=".5"/>
  <rect width="800" height="600" fill="#4e4432" opacity=".05"/>
</svg>
