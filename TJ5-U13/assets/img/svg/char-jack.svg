<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
  <title id="title">Jack peeking from behind a table</title>
  <desc id="desc">A boy in a green tunic peeks over a wooden table edge with a surprised expression.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4c39b"/><stop offset="1" stop-color="#d79a72"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#69a06f"/><stop offset="1" stop-color="#3f6f49"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5a36"/><stop offset="1" stop-color="#5b3620"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#241540" flood-opacity=".3"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- boy body -->
    <path d="M96 272c8-54 34-84 84-84 52 0 78 30 84 84l10 160H86z" fill="url(#tunic)"/>
    <path d="M86 432h192" stroke="#2d5236" stroke-width="10"/>
    <path d="M156 198c8 14 20 20 24 20s16-6 24-20" fill="none" stroke="#e8dcc0" stroke-width="8"/>
    <!-- neck -->
    <path d="M158 166h44v40h-44z" fill="#d79a72"/>
    <!-- head -->
    <ellipse cx="180" cy="120" rx="66" ry="72" fill="url(#skin)"/>
    <path d="M114 108c-4-56 30-86 68-86 40 0 74 32 66 88-2 14-8 12-12 2-10-28-28-36-54-32-24 4-40 14-54 18-8 2-12 14-14 10z" fill="#6b4326"/>
    <path d="M118 86c-10-14 0-30 14-32M242 86c10-14 0-30-14-32" fill="none" stroke="#6b4326" stroke-width="6" stroke-linecap="round"/>
    <!-- brows raised (surprised) -->
    <path d="M140 96c10-10 24-10 34-2M186 94c10-8 24-8 34 2" stroke="#4b2f1c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- eyes wide -->
    <ellipse cx="154" cy="118" rx="10" ry="12" fill="#fff" stroke="#4b2f1c" stroke-width="2"/>
    <ellipse cx="208" cy="118" rx="10" ry="12" fill="#fff" stroke="#4b2f1c" stroke-width="2"/>
    <circle cx="155" cy="120" r="5.5" fill="#2f2118"/>
    <circle cx="209" cy="120" r="5.5" fill="#2f2118"/>
    <circle cx="157" cy="118" r="2" fill="#fff"/><circle cx="211" cy="118" r="2" fill="#fff"/>
    <!-- mouth open -->
    <ellipse cx="181" cy="156" rx="12" ry="10" fill="#7d3a3a"/>
    <ellipse cx="181" cy="153" rx="7" ry="4" fill="#fff" opacity=".8"/>
    <!-- nose -->
    <path d="M181 124c-3 8-2 16 3 20" fill="none" stroke="#c78d63" stroke-width="4" stroke-linecap="round"/>
    <circle cx="132" cy="142" r="9" fill="#e8887e" opacity=".45"/>
    <circle cx="228" cy="142" r="9" fill="#e8887e" opacity=".45"/>
    <!-- hands gripping table edge -->
    <g fill="url(#skin)" stroke="#c78d63" stroke-width="3">
      <path d="M78 400c-16 0-26 14-22 30 4 12 18 18 34 14l14-30z"/>
      <path d="M282 400c16 0 26 14 22 30-4 12-18 18-34 14l-14-30z"/>
    </g>
    <g stroke="#c78d63" stroke-width="3" stroke-linecap="round">
      <path d="M66 420h12M68 432h14M294 420h-12M292 432h-14"/>
    </g>
    <!-- table edge -->
    <path d="M0 430h360v34H0z" fill="url(#wood)"/>
    <path d="M0 464h360v36H0z" fill="#4a2b18"/>
    <path d="M0 430h360" stroke="#b07a4a" stroke-width="6"/>
    <g fill="#3f2414" opacity=".4">
      <path d="M24 430c8 10 8 34 0 34M112 430c-8 10-8 34 0 34M248 430c8 10 8 34 0 34M336 430c-8 10-8 34 0 34"/>
    </g>
  </g>
</svg>
