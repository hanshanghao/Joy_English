<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">The giant's castle hall</title>
  <desc id="desc">A moonlit castle hall with tall windows, purple banners, torches, a giant chair, a table and a golden pedestal.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2156"/><stop offset=".55" stop-color="#3b2e71"/><stop offset="1" stop-color="#241b4a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a224f"/><stop offset="1" stop-color="#17112f"/>
    </linearGradient>
    <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a72c55"/><stop offset="1" stop-color="#6d1738"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b6ba8"/><stop offset="1" stop-color="#1b2a58"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8dc"/><stop offset="1" stop-color="#e9dcae"/>
    </radialGradient>
    <radialGradient id="torchGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity=".85"/><stop offset=".5" stop-color="#ff9c33" stop-opacity=".32"/><stop offset="1" stop-color="#ff9c33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pedestalGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe27a" stop-opacity=".9"/><stop offset=".55" stop-color="#ffc93c" stop-opacity=".25"/><stop offset="1" stop-color="#ffc93c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e2a8f"/><stop offset="1" stop-color="#4a1660"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe89a"/><stop offset=".5" stop-color="#ffc93c"/><stop offset="1" stop-color="#c88a16"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="stone" width="160" height="100" patternUnits="userSpaceOnUse">
      <rect width="160" height="100" fill="#3a2e6b"/>
      <path d="M0 99h160M80 0v50M0 50h160M40 50v49M120 50v49" stroke="#2a2154" stroke-width="3" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="620" fill="url(#stone)" opacity=".55"/>

  <!-- ceiling arches -->
  <g fill="none" stroke="#241a4d" stroke-width="26" opacity=".85">
    <path d="M-80 220c0-180 250-210 400-60M500 120c120-120 330-100 400 60M1260 100c130-120 360-70 420 90"/>
  </g>
  <g fill="#1e153f" opacity=".8">
    <path d="M0 0h1600v70c-300 50-1200 50-1600 0z"/>
  </g>

  <!-- windows -->
  <g>
    <g transform="translate(290 130)">
      <path d="M0 380V140C0 40 70-20 150-20s150 60 150 160v240z" fill="#22183f"/>
      <path d="M18 380V142C18 58 82 2 150 2s132 56 132 140v238z" fill="url(#window)"/>
      <path d="M150 2v378M18 200h264" stroke="#5d78ab" stroke-width="10" opacity=".75"/>
      <circle cx="232" cy="88" r="42" fill="url(#moon)"/>
      <g fill="#dbe8ff" opacity=".85">
        <circle cx="78" cy="80" r="3"/><circle cx="105" cy="128" r="2.5"/><circle cx="66" cy="182" r="2"/><circle cx="214" cy="180" r="3"/><circle cx="118" cy="252" r="2.5"/><circle cx="196" cy="290" r="2"/>
      </g>
      <path d="M40 330l24-120 22 120zM86 340l20-90 18 90zM222 350l18-100 22 100z" fill="#1a1338" opacity=".8"/>
      <path d="M0 380V140C0 40 70-20 150-20s150 60 150 160v240" fill="none" stroke="#4a3a7a" stroke-width="16"/>
      <rect x="-22" y="376" width="344" height="26" rx="8" fill="#4b3a7e"/>
      <path d="M150 2v378M18 200h264" stroke="#4a3a7a" stroke-width="14" opacity=".55"/>
    </g>
    <g transform="translate(1010 130)">
      <path d="M0 380V140C0 40 70-20 150-20s150 60 150 160v240z" fill="#22183f"/>
      <path d="M18 380V142C18 58 82 2 150 2s132 56 132 140v238z" fill="url(#window)"/>
      <path d="M150 2v378M18 200h264" stroke="#5d78ab" stroke-width="10" opacity=".75"/>
      <circle cx="74" cy="98" r="38" fill="url(#moon)"/>
      <g fill="#dbe8ff" opacity=".85">
        <circle cx="210" cy="80" r="3"/><circle cx="236" cy="132" r="2.5"/><circle cx="192" cy="180" r="2"/><circle cx="82" cy="230" r="3"/><circle cx="230" cy="260" r="2.5"/><circle cx="120" cy="312" r="2"/>
      </g>
      <path d="M32 338l22-110 20 110zM198 346l18-96 20 96zM250 352l16-80 18 80z" fill="#1a1338" opacity=".8"/>
      <path d="M0 380V140C0 40 70-20 150-20s150 60 150 160v240" fill="none" stroke="#4a3a7a" stroke-width="16"/>
      <rect x="-22" y="376" width="344" height="26" rx="8" fill="#4b3a7e"/>
      <path d="M150 2v378M18 200h264" stroke="#4a3a7a" stroke-width="14" opacity=".55"/>
    </g>
  </g>

  <!-- banners -->
  <g>
    <g transform="translate(660 40)">
      <path d="M0 0h150v290l-75-46-75 46z" fill="url(#banner)" stroke="#c79a3b" stroke-width="5"/>
      <path d="M75 62c-22-30-60-8-44 24 12 24 44 42 44 42s32-18 44-42c16-32-22-54-44-24z" fill="none" stroke="#ffd25e" stroke-width="9"/>
      <path d="M50 120h50" stroke="#ffd25e" stroke-width="8"/>
      <circle cx="75" cy="160" r="12" fill="#ffd25e"/>
    </g>
    <g transform="translate(790 40)">
      <path d="M0 0h150v290l-75-46-75 46z" fill="url(#banner)" stroke="#c79a3b" stroke-width="5" opacity=".92"/>
      <path d="M75 62c-22-30-60-8-44 24 12 24 44 42 44 42s32-18 44-42c16-32-22-54-44-24z" fill="none" stroke="#ffd25e" stroke-width="9"/>
      <path d="M50 120h50" stroke="#ffd25e" stroke-width="8"/>
      <circle cx="75" cy="160" r="12" fill="#ffd25e"/>
    </g>
  </g>

  <!-- torches -->
  <g>
    <g transform="translate(150 300)">
      <circle cy="70" r="150" fill="url(#torchGlow)" filter="url(#blur)"/>
      <path d="M0 220V64" stroke="#4b3b2c" stroke-width="16"/>
      <path d="M-28 64h56l-10 34h-36z" fill="#7a5a33"/>
      <path d="M0 22c22 22 18 48 0 60-18-12-22-38 0-60z" fill="#ffd25e"/>
      <path d="M0 40c10 12 8 26 0 32-8-6-10-20 0-32z" fill="#fff4c2"/>
      <rect x="-10" y="150" width="20" height="70" rx="8" fill="#3d2d21"/>
    </g>
    <g transform="translate(1450 300)">
      <circle cy="70" r="150" fill="url(#torchGlow)" filter="url(#blur)"/>
      <path d="M0 220V64" stroke="#4b3b2c" stroke-width="16"/>
      <path d="M-28 64h56l-10 34h-36z" fill="#7a5a33"/>
      <path d="M0 22c22 22 18 48 0 60-18-12-22-38 0-60z" fill="#ffd25e"/>
      <path d="M0 40c10 12 8 26 0 32-8-6-10-20 0-32z" fill="#fff4c2"/>
      <rect x="-10" y="150" width="20" height="70" rx="8" fill="#3d2d21"/>
    </g>
  </g>

  <!-- floor -->
  <path d="M0 610h1600v290H0z" fill="url(#floor)"/>
  <g opacity=".3" stroke="#6a5a9c" stroke-width="2">
    <path d="M0 680h1600M0 760h1600M0 840h1600"/>
    <path d="M120 610l-40 290M340 610l-30 290M560 610l-18 290M800 610v290M1040 610l18 290M1260 610l30 290M1480 610l40 290"/>
  </g>
  <path d="M0 600h1600v18H0z" fill="#4d3c80"/>

  <!-- carpet -->
  <path d="M620 610l360 0 190 290H430z" fill="url(#carpet)"/>
  <path d="M650 610l300 0 160 290H490z" fill="none" stroke="#e0b34a" stroke-width="8" opacity=".55"/>
  <g fill="#e0b34a" opacity=".4">
    <path d="M760 700l20-26 20 26-20 26zM820 760l20-26 20 26-20 26zM700 780l20-26 20 26-20 26z"/>
  </g>

  <!-- giant chair -->
  <g transform="translate(90 410)">
    <rect x="0" y="0" width="230" height="260" rx="18" fill="#4b2b1e"/>
    <rect x="18" y="18" width="194" height="170" rx="12" fill="#7a3c2b"/>
    <path d="M18 60h194M18 108h194M18 156h194" stroke="#5b2a1f" stroke-width="10"/>
    <rect x="0" y="200" width="230" height="48" rx="12" fill="#8a4a33"/>
    <rect x="12" y="248" width="28" height="92" fill="#4b2b1e"/>
    <rect x="190" y="248" width="28" height="92" fill="#4b2b1e"/>
    <circle cx="26" cy="26" r="10" fill="#c79a3b"/><circle cx="204" cy="26" r="10" fill="#c79a3b"/>
  </g>

  <!-- table -->
  <g transform="translate(1180 500)">
    <rect x="0" y="0" width="360" height="34" rx="10" fill="#5d3a23"/>
    <rect x="0" y="34" width="360" height="16" fill="#432817"/>
    <rect x="26" y="50" width="22" height="180" fill="#4a2c1a"/>
    <rect x="312" y="50" width="22" height="180" fill="#4a2c1a"/>
    <path d="M20 0h320l-16-44H36z" fill="#8b5a36"/>
    <g fill="#d9c9a3">
      <path d="M242 24c0-12 10-22 22-22s22 10 22 22z"/>
      <rect x="258" y="24" width="14" height="18" rx="4"/>
    </g>
    <path d="M86 2l36-10 6 18-36 8z" fill="#e8dcc4"/>
  </g>

  <!-- pedestal for the hen -->
  <g transform="translate(800 610)">
    <ellipse cy="190" rx="180" ry="34" fill="#150e2a" opacity=".7"/>
    <path d="M-100 190h200l-24-48H-76z" fill="#5a468f"/>
    <path d="M-84 142h168l-16-86H-68z" fill="#7a65b4"/>
    <path d="M-68 56h136l-10-40H-58z" fill="#9a86d0"/>
    <ellipse cy="16" rx="58" ry="16" fill="#bda9e6"/>
    <ellipse cy="16" rx="42" ry="10" fill="#ffd25e" opacity=".5"/>
    <ellipse cy="110" rx="160" ry="100" fill="url(#pedestalGlow)" filter="url(#blur)" opacity=".6"/>
  </g>

  <!-- hanging vines / cobweb details -->
  <g stroke="#8ba0c9" stroke-width="2" opacity=".25" fill="none">
    <path d="M0 70c80 20 130 10 180 50M1600 70c-80 20-130 10-180 50"/>
  </g>

  <!-- magic dust -->
  <g fill="#ffeaa0">
    <circle cx="710" cy="260" r="4" opacity=".8"/><circle cx="770" cy="300" r="2.8" opacity=".6"/><circle cx="860" cy="220" r="3.4" opacity=".75"/>
    <circle cx="900" cy="360" r="2.4" opacity=".55"/><circle cx="690" cy="390" r="2.8" opacity=".5"/><circle cx="820" cy="420" r="3" opacity=".65"/>
    <circle cx="960" cy="280" r="2.2" opacity=".5"/><circle cx="640" cy="320" r="2.4" opacity=".45"/>
  </g>
  <rect width="1600" height="900" fill="#1a0f35" opacity=".08"/>
</svg>
